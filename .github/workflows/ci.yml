name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run check
      - run: bun run check:mcp
      - run: bun run test
      - run: bun run test:coverage
      - run: bun run type-check
      - run: bun run build

  tauri:
    name: Tauri check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo check --locked
        working-directory: src-tauri

  windows-package-smoke:
    name: Windows package smoke
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - name: Release preflight
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          bun run release:preflight -- --tag "v$version"
      - run: bun run build
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: bunx tauri build --bundles nsis
      - name: Download previous Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.6 --repo "${{ github.repository }}" `
            --pattern "Spine.Companion_0.2.6_x64-setup.exe" `
            --dir "$env:RUNNER_TEMP" --clobber
          $previous = Join-Path $env:RUNNER_TEMP "Spine.Companion_0.2.6_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $previous)) {
            throw "Previous Windows installer was not downloaded: $previous"
          }
      - name: Install, smoke-test, and uninstall package
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe")
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)."
          }
          $previous = Join-Path $env:RUNNER_TEMP "Spine.Companion_0.2.6_x64-setup.exe"
          ./scripts/test-windows-installer.ps1 -InstallerPath $installer[0].FullName -ApiBase "http://127.0.0.1:17480"
          ./scripts/test-windows-installer.ps1 -InstallerPath $installer[0].FullName `
            -ApiBase "http://127.0.0.1:17481" `
            -PreviousInstallerPath $previous `
            -PreviousInstallerSha256 "191C5087608C25CBA01DFD5659AE83F8F2878A2DCF72F4FF33F91D5534810090"
