name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Release preflight
        run: bun run release:preflight -- --tag "${{ github.ref_name }}"
      - run: bun run lint
      - run: bun run check:mcp
      - run: bun run test
      - run: bun run build
      - run: cargo test
        working-directory: src-tauri

  tauri-package:
    name: Tauri Package (${{ matrix.label }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
            artifact: windows-x64
          - label: Linux x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
          - label: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifact: macos-x64
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: dmg
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Release preflight before packaging
        run: bun run release:preflight -- --tag "${{ github.ref_name }}"
      - name: Package Tauri app
        run: bunx tauri build --bundles ${{ matrix.bundles }}
      - name: Start packaged API and run Windows MCP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COMPANION_API: http://127.0.0.1:17388
        run: |
          $exe = (Resolve-Path "src-tauri/target/release/spine-companion.exe").Path
          $stdout = Join-Path $env:RUNNER_TEMP "spine-companion-api.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "spine-companion-api.stderr.log"
          $process = $null
          function Stop-ProcessTree([int] $processId) {
            foreach ($child in @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $processId")) {
              Stop-ProcessTree $child.ProcessId
            }
            Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
          }
          try {
            $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            $health = $null
            do {
              if ($process.HasExited) {
                throw "Packaged executable exited before the API became healthy. See $stderr"
              }
              try {
                $health = Invoke-RestMethod -Uri "$env:COMPANION_API/health" -TimeoutSec 2
              } catch {
                $health = $null
              }
              if ($health -and $health.ok -eq $true) { break }
              Start-Sleep -Seconds 1
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not ($health -and $health.ok -eq $true)) {
              throw "Packaged API did not become healthy within 45 seconds. See $stderr"
            }
            bun scripts/check-packaged-mcp.mjs $exe
          } finally {
            if ($process) {
              Stop-ProcessTree $process.Id
            }
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spine-companion-tauri-${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg

  publish:
    name: Publish GitHub Release
    needs: tauri-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Choose release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release workflow must run from a version tag." >&2
            exit 1
          fi
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/release-notes-${TAG}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes not found: $NOTES_FILE" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --prerelease
            else
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi
          bun scripts/generate-sha256sums.mjs release-artifacts SHA256SUMS.txt
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release artifacts found." >&2
            exit 1
          fi
          gh release upload "$TAG" SHA256SUMS.txt "${files[@]}" --clobber
