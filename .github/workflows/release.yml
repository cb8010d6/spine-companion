name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Verify tag commit matches remote main
        if: github.ref_type == 'tag'
        id: release-commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          main_commit="$(git ls-remote --refs origin refs/heads/main | awk 'NF { print $1; exit }')"
          if [[ ! "$tag_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Tag did not resolve to a full commit: $tag_commit" >&2
            exit 1
          fi
          if [[ ! "$main_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Remote main did not resolve to a full commit." >&2
            exit 1
          fi
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "main_commit=$main_commit" >> "$GITHUB_OUTPUT"
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Tag $TAG resolves to $tag_commit, but remote main is $main_commit." >&2
            exit 1
          fi
      - name: Release preflight
        run: bun run release:preflight -- --tag "${{ github.ref_name }}" --tag-commit "${{ steps.release-commit.outputs.tag_commit }}" --main-commit "${{ steps.release-commit.outputs.main_commit }}"
      - run: bun run lint
      - run: bun run check:mcp
      - run: bun run test
      - run: bun run build
      - run: cargo test
        working-directory: src-tauri

  tauri-package:
    name: Tauri Package (${{ matrix.label }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
            artifact: windows-x64
          - label: Linux x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
          - label: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifact: macos-x64
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: dmg
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Release preflight before packaging
        run: bun run release:preflight -- --tag "${{ github.ref_name }}"
      - name: Package Tauri app
        run: bunx tauri build --bundles ${{ matrix.bundles }}
      - name: Download previous Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.6-rc.10 --repo "${{ github.repository }}" `
            --pattern "Spine.Companion_0.2.6-rc.10_x64-setup.exe" `
            --dir "$env:RUNNER_TEMP" --clobber
          $previous = Join-Path $env:RUNNER_TEMP "Spine.Companion_0.2.6-rc.10_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $previous)) {
            throw "Previous Windows installer was not downloaded: $previous"
          }
      - name: Install, smoke-test, and uninstall Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe")
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)."
          }
          $previous = Join-Path $env:RUNNER_TEMP "Spine.Companion_0.2.6-rc.10_x64-setup.exe"
          ./scripts/test-windows-installer.ps1 -InstallerPath $installer[0].FullName `
            -PreviousInstallerPath $previous `
            -PreviousInstallerSha256 "844049CC7F6478F6FEE6C0AF1AD50E7215F0D68DEF73293815837AF78A3292B1"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spine-companion-tauri-${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg

  publish:
    name: Publish GitHub Release
    needs: tauri-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Choose release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release workflow must run from a version tag." >&2
            exit 1
          fi
      - name: Verify tag commit matches remote main
        id: release-commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          main_commit="$(git ls-remote --refs origin refs/heads/main | awk 'NF { print $1; exit }')"
          if [[ ! "$tag_commit" =~ ^[0-9a-fA-F]{40}$ || ! "$main_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Unable to resolve full tag and remote main commits." >&2
            exit 1
          fi
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "main_commit=$main_commit" >> "$GITHUB_OUTPUT"
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Tag $TAG resolves to $tag_commit, but remote main is $main_commit." >&2
            exit 1
          fi
      - name: Validate release artifact matrix
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bun run release:preflight -- --tag "$TAG" --tag-commit "${{ steps.release-commit.outputs.tag_commit }}" --main-commit "${{ steps.release-commit.outputs.main_commit }}" --artifacts release-artifacts
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/release-notes-${TAG}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes not found: $NOTES_FILE" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --prerelease
            else
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi
          bun scripts/generate-sha256sums.mjs release-artifacts SHA256SUMS.txt
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release artifacts found." >&2
            exit 1
          fi
          gh release upload "$TAG" SHA256SUMS.txt "${files[@]}" --clobber
