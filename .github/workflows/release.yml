name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tauri-package:
    name: Tauri Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) && '["windows-latest"]' || '["windows-latest","ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:mcp
      - run: bun run test
      - run: bun run test:coverage
      - run: bun run build
      - run: cargo test
        working-directory: src-tauri
      - run: cargo check
        working-directory: src-tauri
      - name: Package Tauri app (Windows prerelease)
        if: ${{ matrix.os == 'windows-latest' && (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) }}
        run: bunx tauri build --bundles nsis
      - name: Package Tauri app
        if: ${{ !(matrix.os == 'windows-latest' && (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc'))) }}
        run: bun run tauri:build
      - uses: actions/upload-artifact@v5
        with:
          name: spine-companion-tauri-${{ matrix.os }}
          retention-days: 1
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz

  publish:
    name: Publish GitHub Release
    needs: tauri-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Choose release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release workflow must run from a version tag." >&2
            exit 1
          fi
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$TAG" --title "$TAG" --notes "Automated prerelease from develop." --prerelease
            else
              gh release create "$TAG" --title "$TAG" --notes "Automated release."
            fi
          fi
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release artifacts found." >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
