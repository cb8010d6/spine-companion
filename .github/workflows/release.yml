name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:mcp
      - run: bun run test
      - run: bun run build
      - run: cargo test
        working-directory: src-tauri

  tauri-package:
    name: Tauri Package (${{ matrix.label }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            bundles: nsis
            artifact: windows-x64
          - label: Linux x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
          - label: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifact: macos-x64
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: dmg
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Package Tauri app
        run: bunx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v5
        with:
          name: spine-companion-tauri-${{ matrix.artifact }}
          retention-days: 1
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg

  publish:
    name: Publish GitHub Release
    needs: tauri-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Choose release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release workflow must run from a version tag." >&2
            exit 1
          fi
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          NOTES_FILE="docs/releases/release-notes-${TAG}.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              if [[ -f "$NOTES_FILE" ]]; then
                gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --prerelease
              else
                gh release create "$TAG" --title "$TAG" --notes "Automated prerelease." --prerelease
              fi
            else
              if [[ -f "$NOTES_FILE" ]]; then
                gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
              else
                gh release create "$TAG" --title "$TAG" --notes "Automated release."
              fi
            fi
          elif [[ -f "$NOTES_FILE" ]]; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release artifacts found." >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
