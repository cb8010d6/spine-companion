<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spine Companion - Quick Panel</title>
    <link rel="stylesheet" href="/src/renderer/panel.css" />
  </head>
  <body>
    <div id="panel-app">
      <header class="panel-header">
        <div class="logo-area">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span class="title">Spine Companion</span>
        </div>
        <div class="status-indicator">
          <span class="dot" id="global-status-dot"></span>
          <span class="text" id="global-status-text">idle</span>
          <button id="panel-pin" class="pin-button" type="button" aria-pressed="false" title="Pin panel">Pin</button>
        </div>
      </header>

      <div class="model-section">
        <div class="model-preview" id="panel-model-preview">SC</div>
        <div class="model-info">
          <div class="model-name" id="panel-model-name">None</div>
          <div class="model-skel" id="panel-model-skel">No model loaded</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="quick-state-section" id="quick-state-section" aria-label="Quick state controls"></div>

      <div class="divider"></div>

      <div class="controls-section">
        <div class="control-row">
          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/></svg>
          </span>
          <label>Scale</label>
          <input type="range" id="scale-slider" min="0.1" max="3" step="0.05" value="1" aria-label="Scale">
          <span class="value" id="scale-val">1.00x</span>
        </div>
        <div class="control-row">
          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </span>
          <label>Progress Bubble</label>
          <label class="switch">
            <input type="checkbox" id="bubble-toggle" aria-label="Progress Bubble">
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="control-row">
          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/></svg>
          </span>
          <label>Bubble Theme</label>
          <select id="bubble-theme" aria-label="Bubble Theme">
            <option value="solid">Solid</option>
            <option value="soft">Soft</option>
            <option value="clear">Clear</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div class="control-row">
          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </span>
          <label>Status Panel</label>
          <label class="switch">
            <input type="checkbox" id="hud-toggle" aria-label="Status Panel">
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>

      <div class="divider"></div>

      <div class="reminder-section">
        <div class="ai-title">Reminders</div>
        <div id="reminder-list" class="reminder-list">No reminders</div>
      </div>

      <div class="divider"></div>

      <div class="update-section">
        <div class="ai-title">Updates</div>
        <div id="update-status" class="update-status">Not checked</div>
      </div>

      <div class="divider"></div>

      <div class="ai-bridge-section">
        <div class="ai-title">AI Bridge Status</div>
        <div class="ai-list">
          <div class="ai-item"><span class="ai-dot codex-dot"></span><span class="ai-name">Codex / MCP</span></div>
          <div class="ai-item"><span class="ai-dot claude-dot"></span><span class="ai-name">Claude</span></div>
          <div class="ai-item"><span class="ai-dot cursor-dot"></span><span class="ai-name">Cursor</span></div>
          <div class="ai-item"><span class="ai-dot local-dot"></span><span class="ai-name">Local API</span></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="actions-section">
        <button id="btn-manager" type="button" aria-label="Open Manager">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          Open Manager
        </button>
        <button id="btn-quit" class="danger" type="button" aria-label="Quit Spine Companion">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Quit
        </button>
      </div>
    </div>
    <script type="module" src="/src/renderer/panel.js"></script>
  </body>
</html>
