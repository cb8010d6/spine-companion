<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spine Companion - Manager</title>
  </head>
  <body>
    <div id="manager-app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" role="presentation">
              <defs>
                <linearGradient id="brand-ribbon-a" x1="5" y1="4" x2="33" y2="34" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#55D8FF" />
                  <stop offset="0.52" stop-color="#65D8AF" />
                  <stop offset="1" stop-color="#FFD36E" />
                </linearGradient>
                <linearGradient id="brand-ribbon-b" x1="34" y1="8" x2="11" y2="35" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#8098FF" />
                  <stop offset="0.52" stop-color="#D980E8" />
                  <stop offset="1" stop-color="#FF7D8C" />
                </linearGradient>
              </defs>
              <path d="M7 12.5C7 8.9 9.9 6 13.5 6H23c4.4 0 8 3.6 8 8v2H20.5c-2.5 0-4.5 2-4.5 4.5V34l-5.1-4.1A10.3 10.3 0 0 1 7 21.9v-9.4Z" fill="url(#brand-ribbon-a)" />
              <path d="M33 16v7.5c0 5.8-4.7 10.5-10.5 10.5H16V20.5c0-2.5 2-4.5 4.5-4.5H33Z" fill="url(#brand-ribbon-b)" />
              <circle cx="23.8" cy="24.6" r="2.2" fill="white" fill-opacity=".9" />
            </svg>
          </span>
          <span class="sidebar-brand-copy">
            <strong>Spine Companion</strong>
            <small>Manager</small>
          </span>
        </div>
        <nav id="manager-nav" aria-label="Manager">
          <button type="button" data-view="dashboard" class="active">Dashboard</button>
          <button type="button" data-view="library">Library</button>
          <button type="button" data-view="integrations">AI Integrations</button>
          <button type="button" data-view="settings">Settings</button>
          <button type="button" data-view="diagnostics">Diagnostics</button>
        </nav>
        <div class="sidebar-footer"><span class="runtime-dot" aria-hidden="true"></span><span id="runtime-label">Tauri</span></div>
      </aside>
      <div class="main-wrapper">
        <header class="topbar">
          <div class="topbar-page">
            <strong id="topbar-title">Dashboard</strong>
            <span id="topbar-status">Loading...</span>
          </div>
          <div class="topbar-actions">
            <label class="topbar-locale" for="topbar-locale-select">
              <span id="topbar-locale-icon" class="topbar-locale-icon" aria-hidden="true"></span>
              <span id="topbar-locale-label" class="sr-only">Language</span>
              <select id="topbar-locale-select" aria-label="Language">
                <option value="auto">System</option>
                <option value="en">English</option>
                <option value="zh-CN">中文</option>
              </select>
            </label>
            <div class="topbar-runtime"><span class="runtime-dot" aria-hidden="true"></span><span id="topbar-runtime-label">Tauri</span></div>
          </div>
        </header>
        <main id="view-container"></main>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

    <script type="module" src="/src/renderer/manager.js"></script>
  </body>
</html>
